name: Deploy API (Render)

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - "render.yaml"
  workflow_dispatch:

jobs:
  trigger-render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy hook
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "No RENDER_DEPLOY_HOOK_URL secret set — relying on Render GitHub auto-deploy."
            exit 0
          fi
          curl -fsS -X POST "$HOOK"
